; AD ARCADE - console de jeux pour la famille M5Stick
; Compiler une cible :  pio run -e m5stickc-plus2   (ou m5stickc-plus, ...)
; Chaque cible produit un .bin unique a flasher a l'adresse 0x0 (voir merge_bin.py)
[platformio]
default_envs = m5stickc-plus2

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:merge_bin.py

[env:m5stickc-plus2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc_plus2
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.9
    https://github.com/m5stack/M5Unified.git#0.2.7
custom_bin_name = AD-Arcade-M5StickCPlus2
custom_chip = esp32
custom_flash = 8MB

; StickC Plus : meme ecran 135x240, meme disposition A/B/PWR, mais 4 Mo de flash
[env:m5stickc-plus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc_plus
board_build.partitions = default.csv
board_upload.flash_size = 4MB
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.9
    https://github.com/m5stack/M5Unified.git#0.2.7
custom_bin_name = AD-Arcade-M5StickCPlus
custom_chip = esp32
custom_flash = 4MB

; StickS3 : ESP32-S3, 135x240, KEY1/KEY2 + bouton power, IMU BMI270
; (pas de carte officielle dans PlatformIO : on part d'une carte ESP32-S3 generique, M5Unified detecte l'appareil)
[env:m5sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_mode = qio
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
custom_bin_name = AD-Arcade-M5StickS3
custom_chip = esp32s3
custom_flash = 8MB

; Arduino Nesso N1 : ESP32-C6, 135x240 tactile, 2 boutons (A/B), IMU BMI270, buzzer
; Pas de bouton PWR : toucher l'ecran joue ce role (pause, haut/bas du menu, maintenir = retour menu)
[env:nesso-n1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = default.csv
board_upload.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
custom_bin_name = AD-Arcade-NessoN1
custom_chip = esp32c6
custom_flash = 4MB

; StickC (premiere version) : ecran 80x160, 2 boutons + PWR, IMU MPU6886 (ou SH200Q selon la serie)
; L'image 240x135 est reduite pour tenir sur l'ecran (jouable mais petit)
[env:m5stickc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc
board_build.partitions = default.csv
board_upload.flash_size = 4MB
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.9
    https://github.com/m5stack/M5Unified.git#0.2.7
custom_bin_name = AD-Arcade-M5StickC
custom_chip = esp32
custom_flash = 4MB

; Cardputer : ESP32-S3 (StampS3), ecran 240x135 (identique a la Plus2), clavier, pas de capteur de mouvement
; Touches : Entree/Espace (ou bouton Go) = A, Tab ou Ctrl = B, Del = PWR (maintenir = menu), ; , . / = inclinaison
; Rotation 0 : avec M5GFX 0.3.0 le Cardputer (et l'ADV) est deja en paysage (retour d'un utilisateur ADV)
[env:m5cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DAD_CARDPUTER
    -DSCR_ROT=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
    symlink://vendor/M5Cardputer
; la bibliotheque M5Cardputer (MIT, clavier) est copiee dans vendor/ sans sa dependance IRremote
custom_bin_name = AD-Arcade-M5Cardputer
custom_chip = esp32s3
custom_flash = 8MB
