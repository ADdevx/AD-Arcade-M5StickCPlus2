; AD ARCADE for the M5StickC Plus2
; Build: pio run -e m5stickc-plus2
; Output: AD-Arcade-M5StickCPlus2.bin in the project root (single image, flash at 0x0), see merge_bin.py
[platformio]
default_envs = m5stickc-plus2

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
extra_scripts = post:merge_bin.py

[env:m5stickc-plus2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc_plus2
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.9
    https://github.com/m5stack/M5Unified.git#0.2.7
custom_bin_name = AD-Arcade-M5StickCPlus2
custom_chip = esp32
custom_flash = 8MB
